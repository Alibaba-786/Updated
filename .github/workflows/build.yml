name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:          # manual trigger

jobs:
  build:
    runs-on: ubuntu-22.04     # <-- 22.04 zaroori (24.04 pe libs nahi milti)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            libltdl-dev libgl1-mesa-dev libgles2-mesa-dev curl

      - name: Install buildozer with FIXED versions
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0
          pip uninstall -y sh || true
          pip install sh==1.14.3          # <-- YAHI FIX (exit code 100)
          pip install "cython<3.0"        # <-- Cython 3 buildozer todta hai
          pip install setuptools virtualenv

      - name: Build APK
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          yes | buildozer android accept-sdk-license || true
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-APK
          path: bin/*.apk
