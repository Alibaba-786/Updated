name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:        # ← Actions tab se manually bhi trigger kar sakte ho

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build APK with Buildozer
        uses: digreatbrian/buildozer-action@v2
        with:
          python-version: 3.8
          buildozer-cmd: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-APK
          path: ./bin/*.apk
